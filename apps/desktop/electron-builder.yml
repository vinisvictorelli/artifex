appId: com.artifex.desktop
productName: Artifex
electronVersion: 44.1.1
# Sem módulos nativos (o renderer é empacotado pelo Vite): pula o rebuild/instalação de dependências.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - dist-renderer/**/*
# Backend Python empacotado por `python apps/backend/build.py` (PyInstaller, onedir).
extraResources:
  - from: ../backend/dist/artifex-backend
    to: backend
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.video
  target: [dmg]
linux:
  target: [AppImage]
  category: Video
win:
  target: [nsis]
